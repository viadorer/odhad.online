          Mapa a ocenění běží v systému PTF reality (ptf.cz/mapa) — stejná data

          Hlavička s logem Odhad.Online zůstává nahoře (výška 80 px).
        -->
        <iframe
            src="https://www.ptf.cz/mapa?zdroj=odhad"
            title="Mapa nemovitostí a odhad ceny"
            allow="geolocation; clipboard-write"
            loading="eager"
            style="position: fixed; top: 80px; left: 0; width: 100%; height: calc(100dvh - 80px); border: 0; background: #f3f4f6;"
        ></iframe>
